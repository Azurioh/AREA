services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - area-network

  app:
    build:
      context: ../../
      dockerfile: apps/backend/.docker/Dockerfile.dev
    ports:
      - "3000:${PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - BASE_API_URL=${BASE_API_URL}
      - PORT=${PORT}
      - CRYPT_SECRET_KEY=${CRYPT_SECRET_KEY}
      - WEB_OAUTH_CALLBACK_URL=${WEB_OAUTH_CALLBACK_URL}
      - MOBILE_OAUTH_CALLBACK_URL=${MOBILE_OAUTH_CALLBACK_URL}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DATABASE=${MONGO_INITDB_DATABASE}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_STATE_TOKEN_SECRET=${JWT_STATE_TOKEN_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - DROPBOX_CLIENT_ID=${DROPBOX_CLIENT_ID}
      - DROPBOX_CLIENT_SECRET=${DROPBOX_CLIENT_SECRET}
    volumes:
      - ./src:/app/apps/backend/src
      - ../../packages:/app/packages
    networks:
      - area-network

networks:
  area-network:
    driver: bridge

volumes:
  mongo_data:
