services:
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
      - mongo_data:/data/db
    networks:
      - area-network

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - area-network

  server:
    build:
      context: .
      dockerfile: apps/backend/.docker/Dockerfile.dev
    ports:
      - "8080:${PORT}"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - BASE_API_URL=${BASE_API_URL}
      - PORT=${PORT}
      - CRYPT_SECRET_KEY=${CRYPT_SECRET_KEY}
      - WEB_OAUTH_CALLBACK_URL=${WEB_OAUTH_CALLBACK_URL}
      - MOBILE_OAUTH_CALLBACK_URL=${MOBILE_OAUTH_CALLBACK_URL}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DATABASE=${MONGO_INITDB_DATABASE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_STATE_TOKEN_SECRET=${JWT_STATE_TOKEN_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - DROPBOX_CLIENT_ID=${DROPBOX_CLIENT_ID}
      - DROPBOX_CLIENT_SECRET=${DROPBOX_CLIENT_SECRET}
      - UNSPLASH_CLIENT_ID=${UNSPLASH_CLIENT_ID}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_WEBHOOK_SECRET=${TWITCH_WEBHOOK_SECRET}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages:/app/packages
    depends_on:
      - mongodb
      - redis
    networks:
      - area-network

  client_mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    volumes:
      - shared_volume:/shared

  client_web:
    build:
      context: .
      dockerfile: apps/frontend/.docker/Dockerfile.prod
    ports:
      - "8081:80"
    volumes:
      - shared_volume:/shared
    depends_on:
      - client_mobile
      - server

volumes:
  shared_volume:
  mongo_data:
  redis_data:

networks:
  area-network:
    driver: bridge
