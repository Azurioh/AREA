env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2025/G-DEV-500-MLH-5-2-area-4.git"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  push_to_mirror:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
